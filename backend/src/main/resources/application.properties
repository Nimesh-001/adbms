spring.application.name=supermart-backend
server.port=8080

# Database Connection (Pure JDBC - MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/supermart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=SuperMartHikariPool

# Logging
logging.level.org.springframework.jdbc=INFO
logging.level.com.supermart=DEBUG
